[package]
name = "script-bench"
version = "0.1.0"
edition = "2021"
authors = ["Aleksandr Orlenko <zxteam@pm.me>"]

[lib]
name = "script_bench"

[features]
rc = ["koto/rc"]
arc = ["koto/arc"]
gc = ["koto/gc"]
agc = ["koto/agc"]
log = []

[dependencies]
rand = "0.9"
anyhow = { version = "1.0" }
koto = { path = "../koto/crates/koto", default-features = false }

[dev-dependencies]
criterion = { version = "0.7" }

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bench]]
name = "koto"
harness = false
